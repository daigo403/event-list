        }
        
        function getColoredName(member, myUserId) {
            let name = member.name;
            let colored = "";
            if (name.includes('[f]')) {
                colored = `<span class="gender-f">${name}</span>`;
            } else if (name.includes('[m]')) {
                colored = `<span class="gender-m">${name}</span>`;
            } else {
                colored = `<span class="gender-unknown">${name}</span>`;
            }

            let adminBadge = "";
            if (member.userId === ADMIN_USER_ID) {
                adminBadge = `<span class="admin-badge">管理者</span>`;
            }

            if (myUserId && member.userId === myUserId) {
                return `${adminBadge}<span class="my-name-badge">★自分</span><span style="font-weight:bold; text-decoration: underline; background: #fef08a;">${colored}</span>`;
            }
            return adminBadge + colored;
        }

        function isPastEvent(e) {
            const endDateTime = new Date(`${e.date}T${e.end_time}:00`);
            return endDateTime < new Date();
        }
        
        let allCategories = [...new Set(events.map(e => e.category))];
        let selectedCategories = new Set(allCategories);
        let activeDates = [...new Set(events.map(e => e.date))].sort();
        let currentDayIndex = 0;

        function updatePulldown() {
            const select = document.getElementById('userSelect');
            const monthKey = `${currentYear}-${currentMonth.toString().padStart(2,'0')}`;
            const members = membersByMonth[monthKey] || [];
            const savedUserId = localStorage.getItem('selectedUserId');
            
            select.innerHTML = '<option value="">選択してください...</option>';
            members.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.userId;  
                
                if (m.userId === ADMIN_USER_ID) {
                    opt.text = "【管理者】 " + m.name;
                } else {
                    opt.text = m.name;
                }
                
                if (m.userId === savedUserId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function toggleAll(checked) {
            selectedCategories = checked ? new Set(allCategories) : new Set();
            document.querySelectorAll('#filterButtons input').forEach(cb => cb.checked = checked);
            render();
        }

        function saveUser() { 
            localStorage.setItem('selectedUserId', document.getElementById('userSelect').value); 
            render(); 
        }

        function renderModal(dateKey) {
            const myUserId = document.getElementById('userSelect').value;
            const dayEvents = events.filter(e => e.date === dateKey);
            const admin = isAdminUser();
            let html = `<div style="font-size:24px; font-weight:bold; margin-bottom:10px;">${dateKey} の全イベント</div>`;
            
            dayEvents.forEach((e) => {
                const isParticipating = myUserId && e.members.some(m => m.userId === myUserId);
                const past = isPastEvent(e);
                
                let borderStyle = isParticipating ? "border: 3px solid #d00 !important; background-color: #fff9f9;" : "border: 1px solid #ddd;";
                if (past) {
                    borderStyle = "border: 1px solid #94a3b8; background-color: #cbd5e1;";
                }
                
                const sortedMems = sortMembers(e.members);
                const membersHtml = sortedMems.map(m => getColoredName(m, myUserId)).join(', ');
                const pastStamp = past ? '<div class="past-stamp">終了</div>' : '';

                const dtTextEscaped = generateDateTimePlaceText(e);
                const eventInfoLabel = `${e.date_str} ${e.time}～${e.end_time} [${e.place}]`;
                
                let dtCopyBtnHtml = `<div style="margin-top: 10px;">`;
                dtCopyBtnHtml += `<button class="btn-copy-url" onclick="copyEventUrl('${e.url}', \`${eventInfoLabel}\`)">🔗 イベントURLコピー</button>`;
                dtCopyBtnHtml += `<button class="btn-copy-dt" onclick="copyDateTimePlace(\`${dtTextEscaped}\`, \`${eventInfoLabel}\`)">📋 日時・場所コピー</button>`;

                if (admin) {
                    const noticeTextEscaped = generateTrialNotice(e).replace(/`/g, '\`').replace(/\$/g, '\$');
                    dtCopyBtnHtml += ` <button class="btn-copy" onclick="copyTrialNotice(\`${noticeTextEscaped}\`, \`${eventInfoLabel}\`)">📋 体験参加案内文コピー</button>`;
                }
                dtCopyBtnHtml += `</div>`;

                html += `<div style="${borderStyle} padding:12px; margin-bottom:12px; border-radius:8px; position:relative; overflow:hidden;">
                    ${pastStamp}
                    <div style="font-size:24px;">${e.title}</div>
                    <div style="font-size:22px; color:${past ? '#334155' : '#c00'}; font-weight:bold;"> ${e.date_str} ${e.time} ～ ${e.end_time} [${e.place}]</div>
                    <div style="color:#555; font-size:20px;">参加人数: ${e.capacity}</div>
                    <div style="font-size:20px; color:${past ? '#334155' : '#005500'}; font-weight:bold;">参加者: ${membersHtml}</div>
                    <div style="font-size:18px; ">予約名義: ${e.reservation_name}</div>
                    <div style="margin-top: 6px;"><a href="${e.url}" target="_blank" class="btn-detail">詳細・申込はこちら</a></div>
                    ${dtCopyBtnHtml}
                </div>`;
            });
            document.getElementById('modalBody').innerHTML = html;
        }

        function changeDay(n) {
            currentDayIndex = Math.max(0, Math.min(currentDayIndex + n, activeDates.length - 1));
            renderModal(activeDates[currentDayIndex]);
        }
        
        function render() {
            updatePulldown();
            
            // 最終更新日時からの経過時間チェック（60分以上で警告表示）
            const generatedAtStr = "2026-11-13(金) 00:37:41";
            const cleanGenStr = generatedAtStr.replace(/\([^)]+\)/, '');
            const genTime = new Date(cleanGenStr.replace(/-/g, '/'));
            const nowTime = new Date();
            const diffMinutes = (nowTime - genTime) / (1000 * 60);
            
            const warningBanner = document.getElementById('warningBanner');
            if (warningBanner) {
                if (diffMinutes >= 60) {
                    warningBanner.style.display = 'block';
                } else {
                    warningBanner.style.display = 'none';
                }
            }

            const adminArea = document.getElementById('adminArea');
            const adminDisplayTime = document.getElementById('adminDisplayTime');
            const noticeLink = document.getElementById('noticeLink');

            if (isAdminUser()) {
                adminArea.style.display = 'block';
                if (noticeLink) noticeLink.style.display = 'inline-block';
                if (adminDisplayTime) {
                    adminDisplayTime.innerText = "表示日時: " + getFormattedNow();
                }
            } else {
                adminArea.style.display = 'none';
                if (noticeLink) noticeLink.style.display = 'none';
            }

            document.getElementById('label').innerText = currentYear + "年" + currentMonth + "月";
            const myUserId = document.getElementById('userSelect').value;
            const myEventsOnly = document.getElementById('myEventsOnly').checked;
            const availableOnly = document.getElementById('availableOnly').checked;
            const admin = isAdminUser();
            const todayStr = getTodayStr();
            const tomorrowStr = getTomorrowStr();

            const body = document.getElementById('body'); body.innerHTML = '';
            let firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
            let lastDay = new Date(currentYear, currentMonth, 0).getDate();
            let row = body.insertRow();
            for(let i=0; i<firstDay; i++) row.insertCell();

            for(let i=1; i<=lastDay; i++) {
                if((firstDay + i - 1) % 7 === 0) row = body.insertRow();
                let cell = row.insertCell();
                let dateKey = `${currentYear}-${currentMonth.toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
                
                let day = new Date(currentYear, currentMonth - 1, i).getDay();
                if (holidays.includes(dateKey)) cell.classList.add('hol');
                else if (day === 0) cell.classList.add('sun');
                else if (day === 6) cell.classList.add('sat');
                
                if (dateKey === todayStr) {
                    cell.classList.add('today');
                    cell.innerHTML = `<strong>${i}</strong><span class="today-badge">本日</span>`;
                } else if (dateKey === tomorrowStr) {
                    cell.classList.add('tomorrow');
                    cell.innerHTML = `<strong>${i}</strong><span class="tomorrow-badge">明日</span>`;
                } else {
                    cell.innerHTML = `<strong>${i}</strong>`;
                }
                
                let cellEvents = events.filter(e => e.date === dateKey && selectedCategories.has(e.category));
                if (myEventsOnly) {
                    cellEvents = cellEvents.filter(e => myUserId && e.members.some(m => m.userId === myUserId));
                }
                if (availableOnly) {
                    cellEvents = cellEvents.filter(e => !e.title.includes('満'));
                }

                if (cellEvents.length > 0 && myUserId) {
                    const hasMyEvent = cellEvents.some(e => e.members.some(m => m.userId === myUserId));
                    if (hasMyEvent) {
                        cell.innerHTML += `<span class="my-participate-badge">参加</span>`;
                    }
                }

                cellEvents.forEach(e => {
                    let ev = document.createElement('div');
                    ev.className = 'event';
                    
                    const past = isPastEvent(e);
                    if (past) {
                        ev.classList.add('past-event');
                    } else {
                        ev.style.backgroundColor = e.bg_color;
                        ev.style.color = e.text_color;
                        if (myUserId && e.members.some(m => m.userId === myUserId)) ev.style.border = "2px solid #d00";
                    }

                    ev.innerText = `${e.time} ${e.tag}`;
                    ev.onclick = () => { currentDayIndex = activeDates.indexOf(dateKey); renderModal(dateKey); document.getElementById('modal').style.display = 'block'; };
                    cell.appendChild(ev);
                });
            }

            const listTitle = document.getElementById('eventListTitle');
            const listBody = document.getElementById('eventListBody');
            listTitle.innerText = `${currentYear}年${currentMonth}月のイベント一覧`;
            listBody.innerHTML = '';

            let monthlyEvents = events.filter(e => {
                const [y, m, d] = e.date.split('-').map(Number);
                return y === currentYear && m === currentMonth && selectedCategories.has(e.category);
            });

            if (myEventsOnly) {
                monthlyEvents = monthlyEvents.filter(e => myUserId && e.members.some(m => m.userId === myUserId));
            }
            if (availableOnly) {
                monthlyEvents = monthlyEvents.filter(e => !e.title.includes('満'));
            }

            if (monthlyEvents.length === 0) {
                listBody.innerHTML = '<p style="color: #666; font-size: 16px;">条件に該当するイベントはありません。</p>';
            } else {
                monthlyEvents.forEach(e => {
                    const isParticipating = myUserId && e.members.some(m => m.userId === myUserId);
                    const past = isPastEvent(e);
                    const isTodayEvent = (e.date === todayStr);
                    const isTomorrowEvent = (e.date === tomorrowStr);
                    const eventDiv = document.createElement('div');
                    
                    let borderStyle = isParticipating ? "border: 2px solid #d00; background-color: #fff9f9;" : "border: 1px solid #e0e0e0; background-color: #fff;";
                    
                    if (isTodayEvent && past) {
                        eventDiv.classList.add('today-past-list-item');
                        borderStyle = "border: 2px solid #1a73e8; background-color: #cbd5e1;";
                    } else if (isTodayEvent) {
                        eventDiv.classList.add('today-list-item');
                        borderStyle = "border: 2px solid #1a73e8; background-color: #f1f6ff;";
                    } else if (past) {
                        eventDiv.classList.add('past-list-item');
                        borderStyle = "border: 1px solid #94a3b8; background-color: #cbd5e1;";
                    } else if (isTomorrowEvent) {
                        eventDiv.classList.add('tomorrow-list-item');
                        borderStyle = "border: 2px solid #b22222; background-color: #fdf2f2;";
                    }

                    eventDiv.style.cssText = `border-bottom:2px solid #ccc; padding:12px; margin-bottom:12px; font-size: 18px; border-radius: 8px; position: relative; overflow: hidden; ${borderStyle}`;
                    
                    const sortedMems = sortMembers(e.members);
                    const membersHtml = sortedMems.map(m => getColoredName(m, myUserId)).join(', ');
                    const pastStamp = past ? '<div class="past-stamp">終了</div>' : '';
                    
                    const isFull = e.title.includes('満');
                    const fullStamp = (!past && isFull) ? '<div class="full-stamp">満員</div>' : '';

                    let badgeHtml = '';
                    if (isTodayEvent) {
                        badgeHtml += '<span class="today-badge" style="margin-left: 0; margin-right: 6px;">本日</span>';
                    } else if (isTomorrowEvent) {
                        badgeHtml += '<span class="tomorrow-badge" style="margin-left: 0; margin-right: 6px;">明日</span>';
                    }

                    if (isParticipating) {
                        badgeHtml += '<span class="my-participate-badge">参加</span>';
                    }

                    const dtTextEscaped = generateDateTimePlaceText(e);
                    const eventInfoLabel = `${e.date_str} ${e.time}～${e.end_time} [${e.place}]`;
                    
                    let dtCopyBtnHtml = `<div style="margin-top: 10px;">`;
                    dtCopyBtnHtml += `<button class="btn-copy-url" onclick="copyEventUrl('${e.url}', \`${eventInfoLabel}\`)">🔗 イベントURLコピー</button>`;
                    dtCopyBtnHtml += `<button class="btn-copy-dt" onclick="copyDateTimePlace(\`${dtTextEscaped}\`, \`${eventInfoLabel}\`)">📋 日時・場所コピー</button>`;

                    if (admin) {
                        const noticeTextEscaped = generateTrialNotice(e).replace(/`/g, '\`').replace(/\$/g, '\$');
                        dtCopyBtnHtml += ` <button class="btn-copy" onclick="copyTrialNotice(\`${noticeTextEscaped}\`, \`${eventInfoLabel}\`)">📋 体験参加案内文コピー</button>`;
                    }
                    dtCopyBtnHtml += `</div>`;

                    eventDiv.innerHTML = `
                        ${pastStamp}
                        ${fullStamp}
                        <div style="font-weight:bold; color:#000;">${badgeHtml}${e.date_str} ${e.time}～${e.end_time} [${e.place}]<br>${e.title}</div>
                        <div style="color:#555;">参加人数: ${e.capacity}</div>
                        <div style="color:#555;">参加者: ${membersHtml}</div>
                        <div style="color:#555; font-size:16px;">予約名義: ${e.reservation_name}</div>
                        <div style="margin-top: 6px;"><a href="${e.url}" target="_blank" class="btn-detail">詳細・申込はこちら</a></div>
                        ${dtCopyBtnHtml}
                    `;
                    listBody.appendChild(eventDiv);
                });
            }
        }
        
        const filterContainer = document.getElementById('filterButtons');
        allCategories.forEach(cat => {
            let label = document.createElement('label');
            const style = colorMap[cat] ? `background:${colorMap[cat].bg}; color:${colorMap[cat].text}; padding:2px 5px; border-radius:4px;` : '';
            label.innerHTML = `<span style="${style}"><input type="checkbox" checked value="${cat}"> ${cat}</span> `;
            label.querySelector('input').onchange = (e) => { e.target.checked ? selectedCategories.add(cat) : selectedCategories.delete(cat); render(); };
            filterContainer.appendChild(label);
        });

        function changeMonth(n) {
            if (n === 0) {
                const d = new Date();
                currentYear = d.getFullYear();
                currentMonth = d.getMonth() + 1;
            } else {
                currentMonth += n;
                if (currentMonth > 12) { currentMonth = 1; currentYear++; }
                else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            }
            render();
        }

        render();
    </script>
</body>
</html>
