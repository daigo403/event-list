                    <div style="font-size:24px;">${e.title}</div>
                    <div style="font-size:22px; color:${past ? '#334155' : '#c00'}; font-weight:bold;"> ${e.date_str} ${e.time} ～ ${e.end_time} [${e.place}]</div>
                    <div style="font-size:20px; color:${past ? '#334155' : '#005500'}; font-weight:bold;">参加者: ${membersHtml}</div>
                    <div style="font-size:18px; ">予約名義: ${e.reservation_name}</div>
                    <a href="${e.url}" target="_blank" style="font-size:18px;">詳細・申込はこちら</a>
                </div>`;
            });
            document.getElementById('modalBody').innerHTML = html;
        }

        function changeDay(n) {
            currentDayIndex = Math.max(0, Math.min(currentDayIndex + n, activeDates.length - 1));
            renderModal(activeDates[currentDayIndex]);
        }
        
        function render() {
            updatePulldown();
            document.getElementById('label').innerText = currentYear + "年" + currentMonth + "月";
            const myName = document.getElementById('userSelect').value;

            const body = document.getElementById('body'); body.innerHTML = '';
            let firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
            let lastDay = new Date(currentYear, currentMonth, 0).getDate();
            let row = body.insertRow();
            for(let i=0; i<firstDay; i++) row.insertCell();

            for(let i=1; i<=lastDay; i++) {
                if((firstDay + i - 1) % 7 === 0) row = body.insertRow();
                let cell = row.insertCell();
                let dateKey = `${currentYear}-${currentMonth.toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
                
                let day = new Date(currentYear, currentMonth - 1, i).getDay();
                if (holidays.includes(dateKey)) cell.classList.add('hol');
                else if (day === 0) cell.classList.add('sun');
                else if (day === 6) cell.classList.add('sat');
                
                // 本日・明日日付コマの判定・強調表示（背景色変更なし、枠線のみ）
                if (dateKey === todayStr) {
                    cell.classList.add('today');
                    cell.innerHTML = `<strong>${i}</strong><span class="today-badge">本日</span>`;
                } else if (dateKey === tomorrowStr) {
                    cell.classList.add('tomorrow');
                    cell.innerHTML = `<strong>${i}</strong><span class="tomorrow-badge">明日</span>`;
                } else {
                    cell.innerHTML = `<strong>${i}</strong>`;
                }
                
                events.filter(e => e.date === dateKey && selectedCategories.has(e.category)).forEach(e => {
                    let ev = document.createElement('div');
                    ev.className = 'event';
                    
                    const past = isPastEvent(e);
                    if (past) {
                        ev.classList.add('past-event');
                    } else {
                        ev.style.backgroundColor = e.bg_color;
                        ev.style.color = e.text_color;
                        if (myName && e.members.some(m => m.includes(myName))) ev.style.border = "2px solid #d00";
                    }

                    ev.innerText = `${e.time} ${e.tag}`;
                    ev.onclick = () => { currentDayIndex = activeDates.indexOf(dateKey); renderModal(dateKey); document.getElementById('modal').style.display = 'block'; };
                    cell.appendChild(ev);
                });
            }

            const listTitle = document.getElementById('eventListTitle');
            const listBody = document.getElementById('eventListBody');
            listTitle.innerText = `${currentYear}年${currentMonth}月のイベント一覧`;
            listBody.innerHTML = '';

            const monthlyEvents = events.filter(e => {
                const [y, m, d] = e.date.split('-').map(Number);
                return y === currentYear && m === currentMonth && selectedCategories.has(e.category);
            });

            if (monthlyEvents.length === 0) {
                listBody.innerHTML = '<p style="color: #666; font-size: 16px;">この月に予定されているイベントはありません。</p>';
            } else {
                monthlyEvents.forEach(e => {
                    const isParticipating = myName && e.members.some(m => m.includes(myName));
                    const past = isPastEvent(e);
                    const isTodayEvent = (e.date === todayStr);
                    const isTomorrowEvent = (e.date === tomorrowStr);
                    const eventDiv = document.createElement('div');
                    
                    let borderStyle = isParticipating ? "border: 2px solid #d00; background-color: #fff9f9;" : "border: 1px solid #e0e0e0; background-color: #fff;";
                    
                    if (isTodayEvent && past) {
                        // 本日かつ終了の複合ケース
                        eventDiv.classList.add('today-past-list-item');
                        borderStyle = "border: 2px solid #1a73e8; background-color: #cbd5e1;";
                    } else if (isTodayEvent) {
                        // 本日かつ未終了
                        eventDiv.classList.add('today-list-item');
                        borderStyle = "border: 2px solid #1a73e8; background-color: #f1f6ff;";
                    } else if (past) {
                        // 過去イベント
                        eventDiv.classList.add('past-list-item');
                        borderStyle = "border: 1px solid #94a3b8; background-color: #cbd5e1;";
                    } else if (isTomorrowEvent) {
                        // 明日イベント
                        eventDiv.classList.add('tomorrow-list-item');
                        borderStyle = "border: 2px solid #b22222; background-color: #fdf2f2;";
                    }

                    eventDiv.style.cssText = `border-bottom:2px solid #ccc; padding:10px; margin-bottom:10px; font-size: 18px; border-radius: 5px; position: relative; overflow: hidden; ${borderStyle}`;
                    
                    const membersHtml = e.members.map(m => getColoredName(m, myName)).join(', ');

                    const pastStamp = past ? '<div class="past-stamp">終了</div>' : '';
                    let todayBadge = '';
                    if (isTodayEvent) {
                        todayBadge = '<span class="today-badge" style="margin-left: 0; margin-right: 6px;">本日</span>';
                    } else if (isTomorrowEvent) {
                        todayBadge = '<span class="tomorrow-badge" style="margin-left: 0; margin-right: 6px;">明日</span>';
                    }

                    eventDiv.innerHTML = `
                        ${pastStamp}
                        <div style="font-weight:bold; color:#000;">${todayBadge}${e.date_str} ${e.time}～${e.end_time} [${e.place}]<br>${e.title}</div>
                        <div style="color:#555;">参加者: ${membersHtml}</div>
                        <a href="${e.url}" target="_blank" style="font-size:18px; color:#0066cc;">詳細・申込はこちら</a>
                    `;
                    listBody.appendChild(eventDiv);
                });
            }
        }
        
        
        const filterContainer = document.getElementById('filterButtons');
        allCategories.forEach(cat => {
            let label = document.createElement('label');
            const style = colorMap[cat] ? `background:${colorMap[cat].bg}; color:${colorMap[cat].text}; padding:2px 5px; border-radius:4px;` : '';
            label.innerHTML = `<span style="${style}"><input type="checkbox" checked value="${cat}"> ${cat}</span> `;
            label.querySelector('input').onchange = (e) => { e.target.checked ? selectedCategories.add(cat) : selectedCategories.delete(cat); render(); };
            filterContainer.appendChild(label);
        });

        function changeMonth(n) {
            if (n === 0) {
                currentYear = 2026;
                currentMonth = 11;
            } else {
                currentMonth += n;
                if (currentMonth > 12) { currentMonth = 1; currentYear++; }
                else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            }
            render();
        }

        /*
        function changeMonth(n) {
            currentMonth += n;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            render();
        }
       */

        render();
    </script>
</body>
</html>
